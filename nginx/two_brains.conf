# two_brains — nginx reverse proxy + TLS termination.
#
# Generates a self-signed cert for local testing:
#
#     mkdir -p nginx/certs && cd nginx/certs
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#         -keyout server.key -out server.crt -subj "/CN=localhost"
#
# For production drop a real Let's Encrypt cert at the same paths
# (or wire certbot into the compose file).

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check passes plain HTTP for load-balancer probes.
    location = /health {
        proxy_pass http://app:8000/health;
        access_log off;
    }

    # Everything else upgrades to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS upstream ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Hard cap on body size — agent prompts are tiny, no need for 100 MB uploads.
    client_max_body_size 1m;

    # Hide upstream identity.
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # ── REST + static UI ─────────────────────────────────────────────
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── WebSocket upgrade for /ws/run ────────────────────────────────
    location /ws/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;        # long-running agent loops
    }

    # ── Metrics endpoint — usually scraped from inside the cluster. ──
    location = /metrics {
        # Restrict to private networks; tweak for your topology.
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://app:8000/metrics;
    }
}
